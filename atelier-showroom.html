<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHM Studio — Le Showroom & L'Atelier</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script defer src="/_vercel/insights/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'Recoleta';
            src: url('./Recoleta/Recoleta Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        :root {
            --bg-dark: #221516;
            --bg-card: #2B1C1E;
            --text-light: #E1DBD7;
            --text-dim: #BDAFA3;
            --text-muted: #8F8175;
            --border-color: #3B2326;
            --border-subtle: #331F21;
            --accent-red: #8C2230;
            --accent-red-glow: rgba(59, 5, 16, 0.3);
            --font-heading: 'Cormorant Garamond', 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
            --radius: 12px;
            --transition: cubic-bezier(0.25, 1, 0.5, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════
           APP SHELL
        ═══════════════════════════════════════ */
        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════
           VIEW 1: SHOWROOM
        ═══════════════════════════════════════ */
        #view-showroom {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            z-index: 10;
            padding: 36px 48px;
            overflow: hidden;
        }

        /* Header */
        .showroom-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            flex-shrink: 0;
        }

        .showroom-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .showroom-brand img {
            height: 40px;
            opacity: 0.9;
        }

        .showroom-title h1 {
            font-family: var(--font-heading);
            font-size: 42px;
            font-weight: 400;
            color: var(--text-light);
            line-height: 1;
        }

        .showroom-title p {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        /* Filters */
        .showroom-nav {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .nav-pill {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 8px 20px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.35s var(--transition);
        }

        .nav-pill:hover {
            color: var(--text-light);
            border-color: rgba(255,255,255,0.15);
        }

        .nav-pill.active {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: var(--text-light);
        }

        /* Grid */
        .showroom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            overflow-y: auto;
            padding: 4px 0 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }
        .showroom-grid::-webkit-scrollbar { width: 5px; }
        .showroom-grid::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        /* Card */
        .furniture-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 28px 20px 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            transition: transform 0.5s var(--transition), border-color 0.4s, box-shadow 0.4s;
            position: relative;
        }

        .furniture-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: calc(var(--radius) + 1px);
            border: 2px solid var(--accent-red);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .furniture-card:hover {
            transform: translateY(-6px);
            border-color: transparent;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .furniture-card:hover::before { opacity: 1; }

        .card-img-wrapper {
            width: 100%;
            height: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-img {
            max-width: 90%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 12px 20px rgba(0,0,0,0.5));
            transition: transform 0.6s var(--transition);
        }

        .furniture-card:hover .card-img {
            transform: scale(1.06) translateY(-4px);
        }

        .card-collection {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--accent-red);
            margin-bottom: 5px;
        }

        .card-name {
            font-family: var(--font-heading);
            font-size: 18px;
            text-align: center;
            color: var(--text-light);
        }

        .card-dims {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ═══════════════════════════════════════
           VIEW 2: ATELIER
        ═══════════════════════════════════════ */
        #view-atelier {
            position: absolute;
            inset: 0;
            display: flex;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }

        /* Back button */
        .btn-back {
            position: absolute;
            top: 32px;
            left: 32px;
            z-index: 100;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-subtle);
            color: var(--text-dim);
            font-family: var(--font-body);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 10px 20px 10px 16px;
            border-radius: 100px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .btn-back:hover { color: var(--text-light); background: rgba(255,255,255,0.08); }
        .btn-back svg { width: 14px; height: 14px; }

        /* Preview */
        .atelier-preview {
            flex: 7;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 55%, #252225 0%, var(--bg-dark) 65%);
            overflow: hidden;
        }

        .atelier-preview::after {
            content: '';
            position: absolute;
            width: 55%;
            height: 45%;
            background: radial-gradient(ellipse, var(--accent-red-glow) 0%, transparent 70%);
            pointer-events: none;
        }

        .image-stage {
            position: relative;
            width: 70%;
            height: 70%;
            z-index: 1;
        }

        .layer-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 35px 55px rgba(0,0,0,0.5)) drop-shadow(0 8px 16px rgba(0,0,0,0.25));
            opacity: 0;
            will-change: opacity, transform;
        }
        .layer-img.active { opacity: 1; }

        /* Badge */
        .product-badge {
            position: absolute;
            bottom: 36px;
            left: 36px;
            z-index: 2;
        }
        .badge-collection {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .badge-name {
            display: block;
            font-family: var(--font-heading);
            font-size: 28px;
            color: var(--text-light);
        }
        .badge-dims {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Active materials label */
        .materials-recap {
            position: absolute;
            bottom: 36px;
            right: 36px;
            z-index: 2;
            text-align: right;
        }
        .recap-group { margin-top: 12px; }
        .recap-group:first-child { margin-top: 0; }
        .recap-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .recap-value {
            font-family: var(--font-heading);
            font-size: 17px;
            color: var(--accent-red);
        }

        /* Controls Panel */
        .atelier-controls {
            flex: 3;
            min-width: 380px;
            background: rgba(26, 24, 26, 0.88);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border-left: 1px solid var(--border-color);
            padding: 44px 32px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .controls-header {
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .controls-header h2 {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 400;
            color: var(--text-light);
            margin-bottom: 6px;
        }
        .controls-header p {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        #dynamic-controls { display: flex; flex-direction: column; gap: 36px; }

        .control-group {}
        .control-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--accent-red);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .mat-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .mat-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            color: var(--text-light);
            padding: 16px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.35s var(--transition);
            position: relative;
            overflow: hidden;
        }
        .mat-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--accent-red);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s var(--transition);
        }
        .mat-btn:hover {
            background: rgba(255,255,255,0.05);
            transform: translateY(-2px);
            border-color: rgba(106,33,32,0.35);
        }
        .mat-btn.active {
            border-color: var(--accent-red);
            background: var(--accent-red-glow);
        }
        .mat-btn.active::before { transform: scaleX(1); }

        .swatch {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.06);
            background-size: cover;
            background-position: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.35);
            transition: transform 0.4s var(--transition), border-color 0.3s;
        }
        .mat-btn:hover .swatch { transform: scale(1.08); }
        .mat-btn.active .swatch { border-color: var(--accent-red); }

        .mat-name { font-size: 12px; font-weight: 500; text-align: center; }

        .variant-panel {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .variant-panel.active { display: grid; }

        /* Swatch presets */
        .sw-marbre { background: linear-gradient(145deg, #d4b8a0, #a89080, #c4a898); }
        .sw-bois   { background: linear-gradient(145deg, #c9a87c, #a07a4f, #d4b48c); }
        .sw-laque  { background: linear-gradient(145deg, #EAE6CA, #D3CFB3); }
        .sw-beton  { background: linear-gradient(145deg, #9fa09e, #7a7a7a); }
        .sw-verre  { background: linear-gradient(145deg, rgba(255,255,255,0.3), rgba(200,200,200,0.1)); border: 1px solid rgba(255,255,255,0.2); }

        .back-to-site-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-family: var(--font-body);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
            transition: color 0.3s var(--transition);
            z-index: 20;
        }
        .back-to-site-btn:hover {
            color: var(--text-light);
        }
        .back-to-site-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            #view-showroom { padding: 24px; }
            .showroom-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .showroom-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        }

        /* Floating CTA for mobile */
        .mobile-customize-btn {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            background: var(--accent-red);
            color: #fff;
            border: none;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 16px 32px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(184, 52, 68, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .mobile-customize-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .mobile-close-controls {
            display: none;
            position: sticky;
            top: 0;
            background: rgba(26, 24, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: right;
        }
        .mobile-close-controls button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-light);
            font-family: var(--font-body);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            #view-showroom { padding: 16px; }
            .showroom-header { margin-bottom: 20px; }
            .showroom-title h1 { font-size: 32px; }
            .showroom-nav { overflow-x: auto; padding-bottom: 8px; width: 100%; white-space: nowrap; -webkit-overflow-scrolling: touch; }
            
            #view-atelier { 
                flex-direction: column !important; 
                height: 100dvh !important;
                position: relative !important;
                overflow: hidden !important;
            }
            .btn-back { top: 20px; left: 20px; font-size: 12px; z-index: 20; }
            .atelier-preview { 
                min-height: unset !important;
                height: 100dvh !important;
                flex: none !important;
                padding: 20px; 
                justify-content: center; 
                align-items: center; 
            }
            .image-stage { width: 95%; height: 300px; margin-top: 20px; }
            .product-badge { bottom: 100px; left: 20px; right: auto; transform: none; display: flex; flex-direction: column; gap: 4px; }
            .badge-dims { font-size: 10px; }
            .materials-recap { top: 20px; right: 20px; text-align: right; }
            .recap-title { font-size: 9px; }
            .recap-value { font-size: 11px; }

            .mobile-customize-btn { display: block; }
            .mobile-close-controls { display: block; }

            /* Full-screen modal for controls */
            .atelier-controls {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                flex: none !important;
                min-width: unset !important;
                width: 100% !important;
                height: 100dvh !important;
                border-left: none !important;
                border-radius: 0 !important;
                padding: 0 20px 40px !important;
                z-index: 200 !important;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
                opacity: 0 !important;
                pointer-events: none !important;
                transition: opacity 0.35s ease !important;
            }
            .atelier-controls.modal-open {
                opacity: 1 !important;
                pointer-events: auto !important;
            }

            .atelier-controls::before { display: none; }

            .controls-header { 
                margin-bottom: 24px; 
                padding-bottom: 16px;
                padding-top: 16px;
            }
            .controls-header h2 { font-size: 22px; }
            .controls-header h2::after { display: none; }
            .mat-row { grid-template-columns: 1fr; }
            .variant-panel { grid-template-columns: 1fr 1fr 1fr; }
        }
        
        @media (max-width: 480px) {
            .variant-panel { grid-template-columns: 1fr 1fr; }
            .image-stage { height: 200px; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- ═══════════ SHOWROOM ═══════════ -->
    <div id="view-showroom">
        <a href="index.html" class="back-to-site-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Retour au site
        </a>
        <div class="showroom-header">
            <div class="showroom-title">
                <h1>Le Showroom</h1>
                <p>Explorez notre collection et personnalisez votre pièce unique.</p>
            </div>
            <nav class="showroom-nav" id="filter-nav">
                <button class="nav-pill active" data-filter="all">Tout</button>
                <button class="nav-pill" data-filter="perla">Perla</button>
                <button class="nav-pill" data-filter="olga">Olga</button>
                <button class="nav-pill" data-filter="design">Design</button>
                <button class="nav-pill" data-filter="tv">Meubles TV</button>
                <button class="nav-pill" data-filter="rangement">Rangement</button>
            </nav>
        </div>
        <div class="showroom-grid" id="showroom-grid"></div>
    </div>

    <!-- ═══════════ ATELIER ═══════════ -->
    <div id="view-atelier">
        <button class="btn-back" onclick="backToShowroom()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Showroom
        </button>

        <div class="atelier-preview">
            <div class="image-stage" id="image-stage"></div>
            <div class="product-badge">
                <span class="badge-collection" id="badge-collection"></span>
                <span class="badge-name" id="badge-name"></span>
                <span class="badge-dims" id="badge-dims"></span>
            </div>
            <div class="materials-recap" id="materials-recap"></div>
        </div>

        <button class="mobile-customize-btn" id="mobile-customize-btn">Personnaliser ✦</button>

        <div class="atelier-controls">
            <div class="mobile-close-controls">
                <button id="mobile-close-controls">Appliquer ✓</button>
            </div>
            <div class="controls-header">
                <h2>L'Atelier NHM ⁕</h2>
                <p id="controls-subtitle">Le Luxe Artisanal — Pièces uniques conçues et fabriquées en Algérie. Personnalisez vos matériaux et finitions d'exception.</p>
                <div style="display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;">
                    <span class="preview-label" style="font-size: 10px; padding: 4px 10px; text-transform: uppercase; letter-spacing: 1px;">🇩🇿 Fabriqué en Algérie</span>
                    <span class="preview-label" style="font-size: 10px; padding: 4px 10px; text-transform: uppercase; letter-spacing: 1px;">✨ Savoir-Faire Algérien</span>
                    <span class="preview-label" style="font-size: 10px; padding: 4px 10px; text-transform: uppercase; letter-spacing: 1px;">💎 Pièces Uniques</span>
                </div>
            </div>
            <div id="dynamic-controls"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script>
// ══════════════════════════════════════════════════
// TEXTURES DISPONIBLES
// ══════════════════════════════════════════════════
const TEXTURES = {
    marbre: [
        { id: "marbre_beige",        name: "Beige",       color: "#c5bba8" },
        { id: "marbre_cappuccino",   name: "Cappuccino",  color: "#8E7C68" },
        { id: "marbre_gris",         name: "Gris",        color: "#7a7a7a" },
        { id: "marbre_marbre_vert",  name: "Vert",        color: "#3B5342" },
        { id: "marbre_oman",         name: "Oman",        color: "#e2d7c8" },
        { id: "marbre_omperador",    name: "Omperador",   color: "#594236" },
        { id: "marbre_perlato",      name: "Perlato",     color: "#e6dfd1" },
        { id: "marbre_travetra",     name: "Travetra",    color: "#c7b69c" }
    ],
    bois: [
        { id: "bois_bois_massif_fonce", name: "Massif Foncé", color: "#3e2a1a" },
        { id: "bois_venge_clair",       name: "Wengé Clair",  color: "#c9a87c" },

let currentId = null;

// ══════════════════════════════════════════════════
// SHOWROOM
// ══════════════════════════════════════════════════
function initShowroom() {
    const grid = document.getElementById("showroom-grid");
    grid.innerHTML = "";

    const entries = Object.entries(CATALOGUE);
    entries.forEach(([id, item], i) => {
        const card = document.createElement("div");
        card.className = "furniture-card";
        card.dataset.filter = item.filter;
        card.dataset.id = id;
        card.innerHTML = `
            <div class="card-img-wrapper">
                <img src="${item.thumbnail}" alt="${item.name}" class="card-img" loading="lazy">
            </div>
            <div class="card-collection">${item.collection}</div>
            <div class="card-name">${item.name}</div>
            <div class="card-dims">${item.dims}</div>
        `;
        card.addEventListener("click", () => openAtelier(id));
        grid.appendChild(card);

        gsap.fromTo(card, {opacity: 0, y: 25}, {opacity: 1, y: 0, duration: 0.5, delay: i * 0.04, ease: "power2.out"});
    });

    // Filter pills
    document.querySelectorAll(".nav-pill").forEach(pill => {
        pill.addEventListener("click", () => {
            document.querySelectorAll(".nav-pill").forEach(p => p.classList.remove("active"));
            pill.classList.add("active");
            const f = pill.dataset.filter;
            document.querySelectorAll(".furniture-card").forEach(c => {
                const show = (f === "all" || c.dataset.filter === f);
                c.style.display = show ? "flex" : "none";
                if (show) gsap.fromTo(c, {scale: 0.92, opacity: 0}, {scale: 1, opacity: 1, duration: 0.3});
            });
        });
    });
}

// ══════════════════════════════════════════════════
// ATELIER
// ══════════════════════════════════════════════════
function openAtelier(id) {
    currentId = id;
    const item = CATALOGUE[id];
    activeVariants = {};

    // Set badge
    document.getElementById("badge-collection").textContent = item.collection;
    document.getElementById("badge-name").textContent = item.name;
    document.getElementById("badge-dims").textContent = item.dims;
    document.getElementById("controls-subtitle").textContent = `Personnalisez votre ${item.name}.`;

    buildStage(id, item);
    buildControls(id, item);
    buildRecap(item);

    // Transition
    const tl = gsap.timeline();
    tl.to("#view-showroom", {opacity: 0, scale: 0.96, duration: 0.45, ease: "power2.inOut"})
      .set("#view-showroom", {pointerEvents: "none"})
      .set("#view-atelier", {pointerEvents: "auto"})
      .to("#view-atelier", {opacity: 1, duration: 0.4}, "-=0.15")
      .fromTo("#image-stage .layer-img", {y: 40, opacity: 0}, {y: 0, opacity: 1, duration: 0.7, stagger: 0.08, ease: "power3.out"}, "-=0.15");

    // Only animate controls slide-in on desktop (mobile uses bottom sheet)
    if (window.innerWidth > 768) {
      gsap.fromTo(".atelier-controls", {x: 40, opacity: 0}, {x: 0, opacity: 1, duration: 0.5, ease: "power3.out"});
    }
    gsap.fromTo(".product-badge", {opacity: 0, y: 15}, {opacity: 1, y: 0, duration: 0.4});
    gsap.fromTo(".materials-recap", {opacity: 0, y: 15}, {opacity: 1, y: 0, duration: 0.4});
}

function backToShowroom() {
    const tl = gsap.timeline();
    tl.to("#view-atelier", {opacity: 0, duration: 0.35, ease: "power2.inOut"})
      .set("#view-atelier", {pointerEvents: "none"})
      .set("#view-showroom", {pointerEvents: "auto"})
      .to("#view-showroom", {opacity: 1, scale: 1, duration: 0.45}, "-=0.1");
}

function buildStage(id, item) {
    const stage = document.getElementById("image-stage");
    stage.innerHTML = "";

    // Affiche l'image originale non-éditée
    const origImg = document.createElement("img");
    origImg.className = "layer-img active";
    origImg.id = "original-image";
    origImg.style.zIndex = 0;
    origImg.src = item.base || item.thumbnail;
    origImg.alt = `${item.name} Original`;
    stage.appendChild(origImg);

    if (item.foreground) {
        const fgImg = document.createElement("img");
        fgImg.className = "layer-img active";
        fgImg.id = "foreground-image";
        fgImg.style.zIndex = 10;
        fgImg.style.pointerEvents = "none";
        fgImg.src = item.foreground;
        stage.appendChild(fgImg);
    }

    // Ne génère pas les calques dynamiques au démarrage
    item.zones.forEach(zone => {
        delete activeVariants[zone.id]; // Reset
    });
}

function buildRecap(item) {
    const recap = document.getElementById("materials-recap");
    recap.innerHTML = "";
    item.zones.forEach(zone => {
        const v = activeVariants[zone.id];
        recap.innerHTML += `
            <div class="recap-group">
                <div class="recap-title">${zone.label}</div>
                <div class="recap-value" id="recap-${zone.id}">${v ? v.texName : '—'}</div>
            </div>`;
    });
}

function buildControls(id, item) {
    const container = document.getElementById("dynamic-controls");
    container.innerHTML = "";

    item.zones.forEach((zone, idx) => {
        const group = document.createElement("div");
        group.className = "control-group";

        // Step label
        let html = `<div class="control-label">0${idx+1} — ${zone.label}</div>`;

        // Material family buttons
        html += `<div class="mat-row">`;
        zone.materials.forEach((mat, i) => {
            const fm = FAMILY_META[mat];
            html += `
                <button class="mat-btn ${i===0 ? 'active' : ''}"
                        id="fam-${zone.id}-${mat}"
                        onclick="pickFamily('${zone.id}','${mat}')">
                    <div class="swatch ${fm.swatch}"></div>
                    <span class="mat-name">${fm.name}</span>
                </button>`;
        });
        html += `</div>`;

        // Variant panels for each family
        zone.materials.forEach((mat, i) => {
            html += `<div class="variant-panel ${i===0 ? 'active' : ''}" id="vp-${zone.id}-${mat}">`;
            
            TEXTURES[mat].forEach((tex) => {
                // Handle complex allowedTextures object per material
                if (zone.allowedTextures && zone.allowedTextures[mat]) {
                    if (!zone.allowedTextures[mat].includes(tex.id)) return;
                }
                
                html += `
                    <button class="mat-btn"
                            onclick="pickTexture(this,'${zone.id}','${tex.id}','${tex.name}')">
                        <div class="swatch" style="background:${tex.color}"></div>
                        <span class="mat-name">${tex.name}</span>
                    </button>`;
            });
            html += `</div>`;
        });

        group.innerHTML = html;
        container.appendChild(group);
    });
}

function pickFamily(zoneId, family) {
    // Toggle family buttons — use exact ID matching, not prefix
    const item = CATALOGUE[currentId];
    const zone = item.zones.find(z => z.id === zoneId);
    if (!zone) return;

    zone.materials.forEach(mat => {
        const btn = document.getElementById(`fam-${zoneId}-${mat}`);
        if (btn) btn.classList.remove("active");
        const panel = document.getElementById(`vp-${zoneId}-${mat}`);
        if (panel) panel.classList.remove("active");
    });

    document.getElementById(`fam-${zoneId}-${family}`).classList.add("active");
    const panel = document.getElementById(`vp-${zoneId}-${family}`);
    panel.classList.add("active");
    gsap.fromTo(panel.children, {opacity: 0, y: 10}, {opacity: 1, y: 0, duration: 0.25, stagger: 0.03});

    // Auto-select first texture — force the change even if same texId
    const firstBtn = panel.querySelector(".mat-btn");
    if (firstBtn) {
        const tex = TEXTURES[family][0];
        if (tex) {
            // Deselect all in this panel
            panel.querySelectorAll(".mat-btn").forEach(b => b.classList.remove("active"));
            firstBtn.classList.add("active");
            // Force update (bypass the early return in pickTexture)
            forceTextureChange(zoneId, tex.id, tex.name);
        }
    }
}

function forceTextureChange(zoneId, texId, texName) {
    activeVariants[zoneId] = { texId, texName };

    const stage = document.getElementById("image-stage");

    // Kill ONLY this zone's tweens — use exact ID match, not prefix
    const exactLayer = document.getElementById(`layer-${zoneId}`);
    const exactPending = document.getElementById(`layer-${zoneId}-new`);
    if (exactLayer) gsap.killTweensOf(exactLayer);
    if (exactPending) gsap.killTweensOf(exactPending);

    // Resolve current image for this zone
    let currentImg = exactLayer;
    if (exactPending) {
        if (currentImg) currentImg.remove();
        exactPending.id = `layer-${zoneId}`;
        exactPending.classList.add("active");
        gsap.set(exactPending, { opacity: 1, scale: 1 });
        currentImg = exactPending;
    }

    const item = CATALOGUE[currentId];

    if (!currentImg) {
        // If there's no layer for this zone yet, it means this is the first interaction!
        const zone = item.zones.find(z => z.id === zoneId);
        
        const newImg = document.createElement("img");
        newImg.className = "layer-img";
        newImg.id = `layer-${zoneId}-new`;
        newImg.style.position = "absolute";
        newImg.style.zIndex = zone.z;
        if (item.staticPhotos && item.staticPhotos[texId]) {
            newImg.src = encodeURI(item.staticPhotos[texId]);
        } else if (texId === "verre") {
            newImg.src = "data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'/>";
        } else {
            const basePath = `Photo atelier/final/generations_automatiques/${currentId}/${zoneId}_${texId}`;
            newImg.src = encodeURI(`${basePath}.webp`);
            newImg.onerror = function() {
                if (this.src.includes('.webp')) {
                    this.src = encodeURI(`${basePath}.png`);
                    this.onerror = null;
                }
            };
        }
        newImg.alt = texName;
        stage.appendChild(newImg);

        // Handle base image dynamically based on whether the new texture is a full photo
        const isFullPhoto = !!(item.staticPhotos && item.staticPhotos[texId]);
        const shouldKeepBase = !isFullPhoto; // Toujours garder la base (sauf si photo complète) pour ne pas effacer les parties originales non modifiées

        const orig = document.getElementById("original-image");
        if (orig) {
            if (!shouldKeepBase && orig.style.opacity !== "0") {
                gsap.to(orig, { opacity: 0, duration: 0.3 });
                
                // Initialize other zones with their default textures so they don't disappear
                item.zones.forEach(z => {
                    if (z.id !== zoneId) {
                        const defTexId = z.defaultTex || TEXTURES[z.materials[0]][0].id;
                        let defMat = z.materials[0];
                        let defTexObj = TEXTURES[defMat].find(t => t.id === defTexId) || TEXTURES[defMat][0];
                        // If defaultTex is from another material, try to find it
                        if (!defTexObj) {
                            for (let m of z.materials) {
                                let t = TEXTURES[m].find(tx => tx.id === defTexId);
                                if (t) { defMat = m; defTexObj = t; break; }
                            }
                        }
                        
                        // Create image silently
                        const otherImg = document.createElement("img");
                        otherImg.className = "layer-img active";
                        otherImg.id = `layer-${z.id}`;
                        otherImg.style.position = "absolute";
                        otherImg.style.zIndex = z.z;
                        if (item.staticPhotos && item.staticPhotos[defTexObj.id]) {
                            otherImg.src = encodeURI(item.staticPhotos[defTexObj.id]);
                        } else if (defTexObj.id === "verre") {
                            otherImg.src = "data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'/>";
                        } else {
                            const basePath = `Photo atelier/final/generations_automatiques/${currentId}/${z.id}_${defTexObj.id}`;
                            otherImg.src = encodeURI(`${basePath}.webp`);
                            otherImg.onerror = function() {
                                if (this.src.includes('.webp')) {
                                    this.src = encodeURI(`${basePath}.png`);
                                    this.onerror = null;
                                }
                            };
                        }
                        otherImg.alt = defTexObj.name;
                        stage.appendChild(otherImg);
                        
                        // Set active in recap
                        activeVariants[z.id] = { texId: defTexObj.id, texName: defTexObj.name };
                        const recap = document.getElementById(`recap-${z.id}`);
                        if (recap) recap.textContent = defTexObj.name;
                        
                        // Visually set the button as active
                        const panel = document.getElementById(`vp-${z.id}-${defMat}`);
                        if (panel) {
                            const btns = panel.querySelectorAll(".mat-btn");
                            btns.forEach(b => b.classList.remove("active"));
                            const targetBtn = Array.from(btns).find(b => b.getAttribute("onclick").includes(defTexObj.id));
                            if (targetBtn) targetBtn.classList.add("active");
                            else if (btns.length > 0) btns[0].classList.add("active");
                        }
                    }
                });
            } else if (shouldKeepBase && orig.style.opacity === "0") {
                gsap.to(orig, { opacity: 1, duration: 0.3 });
            }
            
            // Si on garde la base (ex: on change juste un pied), il faut s'assurer 
            // que les zones qui doivent être "au-dessus" (z supérieur) sont bien générées
            // pour masquer les débordements du pied sur le plateau original.
            if (shouldKeepBase) {
                item.zones.forEach(z => {
                    if (z.id !== zoneId && z.z > zone.z) {
                        const existingImg = document.getElementById(`layer-${z.id}`);
                        if (!existingImg) {
                            const defTexId = z.defaultTex || TEXTURES[z.materials[0]][0].id;
                            let defMat = z.materials[0];
                            let defTexObj = TEXTURES[defMat].find(t => t.id === defTexId) || TEXTURES[defMat][0];
                            if (!defTexObj) {
                                for (let m of z.materials) {
                                    let t = TEXTURES[m].find(tx => tx.id === defTexId);
                                    if (t) { defMat = m; defTexObj = t; break; }
                                }
                            }
                            
                            const otherImg = document.createElement("img");
                            otherImg.className = "layer-img active";
                            otherImg.id = `layer-${z.id}`;
                            otherImg.style.position = "absolute";
                            otherImg.style.zIndex = z.z;
                            if (item.staticPhotos && item.staticPhotos[defTexObj.id]) {
                                otherImg.src = encodeURI(item.staticPhotos[defTexObj.id]);
                            } else if (defTexObj.id === "verre") {
                                otherImg.src = "data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'/>";
                            } else {
                                const basePath = `Photo atelier/final/generations_automatiques/${currentId}/${z.id}_${defTexObj.id}`;
                                otherImg.src = encodeURI(`${basePath}.webp`);
                                otherImg.onerror = function() {
                                    if (this.src.includes('.webp')) {
                                        this.src = encodeURI(`${basePath}.png`);
                                        this.onerror = null;
                                    }
                                };
                            }
                            otherImg.alt = defTexObj.name;
                            stage.appendChild(otherImg);
                            
                            activeVariants[z.id] = { texId: defTexObj.id, texName: defTexObj.name };
                            const recap = document.getElementById(`recap-${z.id}`);
                            if (recap) recap.textContent = defTexObj.name;
                            
                            const panel = document.getElementById(`vp-${z.id}-${defMat}`);
                            if (panel) {
                                const btns = panel.querySelectorAll(".mat-btn");
                                btns.forEach(b => b.classList.remove("active"));
                                const targetBtn = Array.from(btns).find(b => b.getAttribute("onclick").includes(defTexObj.id));
                                if (targetBtn) targetBtn.classList.add("active");
                                else if (btns.length > 0) btns[0].classList.add("active");
                            }
                        }
                    }
                });
            }
        }

        const tl = gsap.timeline({
            onComplete: () => {
                newImg.id = `layer-${zoneId}`;
                newImg.classList.add("active");
            }
        });
        tl.fromTo(newImg, { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" });

    } else {
        const zIdx = currentImg.style.zIndex;

        // Create new image
        const newImg = document.createElement("img");
        newImg.className = "layer-img";
        newImg.id = `layer-${zoneId}-new`;
        newImg.style.position = "absolute";
        newImg.style.zIndex = zIdx;
        if (item.staticPhotos && item.staticPhotos[texId]) {
            newImg.src = encodeURI(item.staticPhotos[texId]);
        } else if (texId === "verre") {
            newImg.src = "data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'/>";
        } else {
            const basePath = `Photo atelier/final/generations_automatiques/${currentId}/${zoneId}_${texId}`;
            newImg.src = encodeURI(`${basePath}.webp`);
            newImg.onerror = function() {
                if (this.src.includes('.webp')) {
                    this.src = encodeURI(`${basePath}.png`);
                    this.onerror = null;
                }
            };
        }
        newImg.alt = texName;
        
        // Insérer juste après l'image courante pour conserver l'ordre DOM correct
        if (currentImg.nextSibling) {
            stage.insertBefore(newImg, currentImg.nextSibling);
        } else {
            stage.appendChild(newImg);
        }

        // Crossfade
        // Handle base image dynamically based on whether the new texture is a full photo
        const isFullPhoto = !!(item.staticPhotos && item.staticPhotos[texId]);
        const shouldKeepBase = !isFullPhoto; // Toujours garder la base (sauf si photo complète)

        const orig = document.getElementById("original-image");
        if (orig) {
            if (!shouldKeepBase && orig.style.opacity !== "0") {
                gsap.to(orig, { opacity: 0, duration: 0.3 });
            } else if (shouldKeepBase && orig.style.opacity === "0") {
                gsap.to(orig, { opacity: 1, duration: 0.3 });
            }
        }

        const outgoing = currentImg;
        const incoming = newImg;
        const tl = gsap.timeline({
            onComplete: () => {
                outgoing.remove();
                incoming.id = `layer-${zoneId}`;
                incoming.classList.add("active");
            }
        });
        tl.to(outgoing, { opacity: 0, scale: 0.96, duration: 0.3, ease: "power2.in" })
          .fromTo(incoming, { opacity: 0, scale: 1.03 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, "-=0.1");
    }

    // Update recap label
    const recap = document.getElementById(`recap-${zoneId}`);
    if (recap) {
        gsap.killTweensOf(recap);
        gsap.to(recap, { opacity: 0, y: -5, duration: 0.15, onComplete: () => {
            recap.textContent = texName;
            gsap.to(recap, { opacity: 1, y: 0, duration: 0.2 });
        }});
    }
}

function pickTexture(btn, zoneId, texId, texName) {
    // Deselect siblings in this panel only
    const panel = btn.closest(".variant-panel");
    if (panel) panel.querySelectorAll(".mat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    // Skip if same texture already active
    if (activeVariants[zoneId]?.texId === texId) return;

    forceTextureChange(zoneId, texId, texName);
}

// Init
window.addEventListener("DOMContentLoaded", () => {
    initShowroom();

    // Mobile Customization Modal Toggle
    if (window.matchMedia("(max-width: 768px)").matches) {
        const controls = document.querySelector('.atelier-controls');
        const customizeBtn = document.getElementById('mobile-customize-btn');
        const closeBtn = document.getElementById('mobile-close-controls');
        
        if (controls && customizeBtn && closeBtn) {
            // Stop lenis scrolling when modal is open
            customizeBtn.addEventListener('click', () => {
                controls.classList.add('modal-open');
                if (window.lenis) window.lenis.stop();
            });
            
            closeBtn.addEventListener('click', () => {
                controls.classList.remove('modal-open');
                if (window.lenis) window.lenis.start();
            });
        }
    }
});
</script>
